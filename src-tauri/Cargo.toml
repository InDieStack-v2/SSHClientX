[package]
name = "sshclientx"
version = "0.3.8"
description = "SSH and SFTP client"
authors = ["Sina Xhpm (sinaxhpm.com)"]
license = "MIT"
edition = "2021"
# russh 0.63's own crate declares rust-version = "1.85" / edition = "2024";
# our crate stays on edition 2021 (no code needs 2024), but the toolchain
# building it must still be >=1.85 to compile that dependency.
rust-version = "1.85"

# Library + binary dual target. The Tauri Builder, command registry, and
# state setup live in `src/lib.rs::run()`. The bin entry point (`src/main.rs`)
# is a one-liner that calls `sshclientx_lib::run()` on desktop; on Android
# Tauri's `#[mobile_entry_point]` attr on `run()` generates the JNI glue and
# the bin is never built. `cdylib` is what Gradle dlopens from the APK.
[lib]
name = "sshclientx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Compile crypto + compression dependencies with full optimization even
# in `cargo build` (debug). Without this, `npm run tauri dev` runs the
# Argon2 KDF unoptimised — vault unlock takes 5-10x longer (1.5-3 s vs
# 200-400 ms) because the inner mixing loops aren't vectorised. The
# rest of our own code stays debug-buildable, so iteration speed and
# panic-on-overflow assertions are unaffected.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[features]
# russh >=0.50 dropped OpenSSL entirely — RSA host-key support (`rsa` feature)
# is pure-Rust (RustCrypto's `rsa`/`pkcs1` crates) and is one of russh's own
# default features, so a plain default build now already negotiates RSA host
# keys with no Perl/C-compiler requirement. `full-ssh-algos` used to exist to
# pull in russh's (now-removed) openssl backend for that; it's kept as a
# feature name only so the release workflow's `--features full-ssh-algos`
# invocation keeps working, and now just adds the two remaining
# danger-flagged legacy algorithms (3DES, DSA) that russh still keeps off by
# default for being weak, not for needing OpenSSL.
default = []
full-ssh-algos = ["russh/des", "russh/dsa"]

[dependencies]
tauri = { version = "2.1", features = [] }
# tauri-plugin-opener replaces the `open` crate for URL opening — the latter
# is excluded on Android (no equivalent crate), so before this plugin the
# About-panel "open repo / website" buttons returned a literal "external
# URLs not wired on Android yet" error. The plugin bridges to ACTION_VIEW
# on Android and to xdg-open / open / start on desktop, so the same Rust
# call works everywhere. We keep `open` for file/folder open-with calls
# (Live Edit, Open in Explorer) which are desktop-only by design and
# already cfg-gated.
tauri-plugin-opener = "2"
hex = "0.4"
# Compact transport for coalesced terminal output over the Tauri event bridge
# (a raw Vec<u8> serializes as a ~4x-bloated JSON number array). Already in the
# dependency tree via tauri/russh, so this direct dep adds no new crate.
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# TCP-level keepalive on the SSH transport sockets (poor-network resilience).
# Already in the tree transitively via tokio — a direct dep adds no new crates.
socket2 = "0.6"
rusqlite = { version = "0.31", features = ["bundled", "backup", "serialize", "functions"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
directories = "5.0"
# russh-keys was merged into russh's own `russh::keys` module at 0.50 and no
# longer exists as a separate crate. See the [features] block above for why
# there's no more OpenSSL dependency here.
russh = "0.63"
ssh-key = { version = "0.6", features = ["alloc", "encryption", "getrandom", "ed25519", "rsa"] }
tokio-socks = "0.5"
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
russh-sftp = "2.4"
notify = "6.1.1"
# Debounces filesystem events so we don't try to upload a file mid-write.
# Mirror watcher uses this — events for the same path within 500ms collapse
# to a single action, which both eliminates partial uploads and keeps
# rapid-fire editor saves (e.g. vim's swap-then-rename pattern) from
# generating spurious traffic. Pairs cleanly with the `notify` 6.x crate
# we already use elsewhere.
notify-debouncer-mini = "0.4"
# Used by the mirror module to stamp downloaded files with the remote's
# mtime. Without it, every freshly-downloaded file has local mtime = now,
# which would make the next dry-run treat the local copy as "newer" and
# offer to re-upload it back. set_file_mtime is a single syscall and
# `filetime` is the standard crate for it (works on Rust 1.70 — std::fs
# alternatives need 1.75+).
filetime = "0.2"
# Content-hash compare in the mirror's initial reconciliation. We trust
# size+mtime as a quick equality check (matching rsync's default), but
# when sizes match and mtimes drift we hash both sides and only count
# the files as different if the digests actually disagree. SHA-256 is
# overkill for a "same or not?" question but it's already pulled in
# transitively by russh/ssh-key, so making the dep explicit costs nothing.
sha2 = "0.10"
regex = "1.10"
# rustls-tls so we don't drag in OpenSSL on Windows builds. multipart for blob
# uploads; json for typed request/response bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
# Vault v2 compresses the SQLite serialisation with zstd before encrypting.
# Real profiles compress ~50-70% (lots of repeated SQL+JSON structure), so
# both local disk and cloud blobs shrink correspondingly. v1 vaults stay
# readable — we only emit v2 going forward.
zstd = { version = "0.13", default-features = false }
# Zeroize-on-drop wrappers for the master vault key and the decompressed
# SQLite plaintext. Without this, secrets stay in the heap until allocator
# reuse — long enough for a swap file / crash dump to capture them. We
# wrap only the things that survive past one function call; transient
# String/Vec passed as args to argon2/aes-gcm are zeroized internally by
# those crates.
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# ---------------------------------------------------------------------------
# Desktop-only deps. These crates either don't compile on Android at all
# (rfd — native file dialog) or have no meaningful mobile equivalent
# (tauri-plugin-window-state — mobile windows aren't resizable/movable;
# open — opening a file in the user's "default desktop app" doesn't map to
# Android's intent system). Their call sites in `lib.rs` and `about.rs` are
# wrapped in `#[cfg(not(target_os = "android"))]`, so the Android build
# doesn't need any of these to compile.
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = "2"
rfd = "0.14"
open = "5.1"
