[package]
name = "sshclientx"
version = "0.3.8"
description = "SSH and SFTP client"
authors = ["Sina Xhpm (sinaxhpm.com)"]
license = "MIT"
edition = "2021"
# The floor here is set by two of our own deps, not russh (which only needs
# 1.85): `keyring` 4.2 declares rust-version = "1.88", and the vault's
# single-writer claim uses `std::fs::File::try_lock`, stabilized in 1.89.
# our crate stays on edition 2021 (no code needs 2024).
rust-version = "1.89"

# Library + binary dual target. The Tauri Builder, command registry, and
# state setup live in `src/lib.rs::run()`. The bin entry point (`src/main.rs`)
# is a one-liner that calls `sshclientx_lib::run()` on desktop; on Android
# Tauri's `#[mobile_entry_point]` attr on `run()` generates the JNI glue and
# the bin is never built. `cdylib` is what Gradle dlopens from the APK.
[lib]
name = "sshclientx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Compile crypto + compression dependencies with full optimization even
# in `cargo build` (debug). Without this, `npm run tauri dev` runs the
# Argon2 KDF unoptimised — vault unlock takes 5-10x longer (1.5-3 s vs
# 200-400 ms) because the inner mixing loops aren't vectorised. The
# rest of our own code stays debug-buildable, so iteration speed and
# panic-on-overflow assertions are unaffected.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.keyring]
opt-level = 3
[profile.dev.package.bip39]
opt-level = 3

[features]
# russh >=0.50 dropped OpenSSL entirely — RSA host-key support (`rsa` feature)
# is pure-Rust (RustCrypto's `rsa`/`pkcs1` crates) and is one of russh's own
# default features, so a plain default build now already negotiates RSA host
# keys with no Perl/C-compiler requirement. `full-ssh-algos` used to exist to
# pull in russh's (now-removed) openssl backend for that; it's kept as a
# feature name only so the release workflow's `--features full-ssh-algos`
# invocation keeps working, and now just adds the two remaining
# danger-flagged legacy algorithms (3DES, DSA) that russh still keeps off by
# default for being weak, not for needing OpenSSL.
default = []
full-ssh-algos = ["russh/des", "russh/dsa"]

[dependencies]
tauri = { version = "2.1", features = [] }
# tauri-plugin-opener replaces the `open` crate for URL opening — the latter
# is excluded on Android (no equivalent crate), so before this plugin the
# About-panel "open repo / website" buttons returned a literal "external
# URLs not wired on Android yet" error. The plugin bridges to ACTION_VIEW
# on Android and to xdg-open / open / start on desktop, so the same Rust
# call works everywhere. We keep `open` for file/folder open-with calls
# (Live Edit, Open in Explorer) which are desktop-only by design and
# already cfg-gated.
tauri-plugin-opener = "2"
hex = "0.4"
# Compact transport for coalesced terminal output over the Tauri event bridge
# (a raw Vec<u8> serializes as a ~4x-bloated JSON number array). Already in the
# dependency tree via tauri/russh, so this direct dep adds no new crate.
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# TCP-level keepalive on the SSH transport sockets (poor-network resilience).
# Already in the tree transitively via tokio — a direct dep adds no new crates.
socket2 = "0.6"
rusqlite = { version = "0.31", features = ["bundled", "backup", "serialize", "functions"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
directories = "5.0"
# russh-keys was merged into russh's own `russh::keys` module at 0.50 and no
# longer exists as a separate crate. See the [features] block above for why
# there's no more OpenSSL dependency here.
russh = "0.63"
ssh-key = { version = "0.6", features = ["alloc", "encryption", "getrandom", "ed25519", "rsa"] }
tokio-socks = "0.5"
async-http-proxy = { version = "1.2", features = ["runtime-tokio"] }
russh-sftp = "2.4"
notify = "6.1.1"
# Debounces filesystem events so we don't try to upload a file mid-write.
# Mirror watcher uses this — events for the same path within 500ms collapse
# to a single action, which both eliminates partial uploads and keeps
# rapid-fire editor saves (e.g. vim's swap-then-rename pattern) from
# generating spurious traffic. Pairs cleanly with the `notify` 6.x crate
# we already use elsewhere.
notify-debouncer-mini = "0.4"
# Used by the mirror module to stamp downloaded files with the remote's
# mtime. Without it, every freshly-downloaded file has local mtime = now,
# which would make the next dry-run treat the local copy as "newer" and
# offer to re-upload it back. set_file_mtime is a single syscall and
# `filetime` is the standard crate for it (works on Rust 1.70 — std::fs
# alternatives need 1.75+).
filetime = "0.2"
# Content-hash compare in the mirror's initial reconciliation. We trust
# size+mtime as a quick equality check (matching rsync's default), but
# when sizes match and mtimes drift we hash both sides and only count
# the files as different if the digests actually disagree. SHA-256 is
# overkill for a "same or not?" question but it's already pulled in
# transitively by russh/ssh-key, so making the dep explicit costs nothing.
sha2 = "0.10"
regex = "1.10"
# rustls-tls so we don't drag in OpenSSL on Windows builds. multipart for blob
# uploads; json for typed request/response bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
# Vault v2 compresses the SQLite serialisation with zstd before encrypting.
# Real profiles compress ~50-70% (lots of repeated SQL+JSON structure), so
# both local disk and cloud blobs shrink correspondingly. v1 vaults stay
# readable — we only emit v2 going forward.
zstd = { version = "0.13", default-features = false }
# Zeroize-on-drop wrappers for the master vault key and the decompressed
# SQLite plaintext. Without this, secrets stay in the heap until allocator
# reuse — long enough for a swap file / crash dump to capture them. We
# wrap only the things that survive past one function call; transient
# String/Vec passed as args to argon2/aes-gcm are zeroized internally by
# those crates.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# End-to-end vault (spec 002): OS secure store for the device-bound DEK.
# Constitution v3.2.0 Technology & Architecture Constraints table, row 2 —
# no stdlib equivalent, the three platform APIs share nothing.
keyring = "4.2"
# End-to-end vault (spec 002): XChaCha20-Poly1305, the preferred seal.
# Constitution table row 1. Pinned to 0.10 (not 0.11) so it stays on the
# same `aead` 0.5 family as our existing `aes-gcm` 0.10 — see
# specs/002-e2e-vault-migration/research.md Decision 9.
chacha20poly1305 = "0.10"
# End-to-end vault (spec 002): recovery-kit phrase encoding. Constitution
# table row 5. See research.md Decision 10 for why the phrase carries only
# the 32-byte wrapped key and requires the vault file to unwrap.
bip39 = "2.2"
# End-to-end vault (spec 002): platform authentication (Touch ID / Windows
# Hello) for the lock lifecycle's quick re-unlock. Constitution table row 4.
# Its own Cargo.toml gates the Windows/macOS backends behind target cfgs;
# our lock.rs additionally cfg's the call sites out on Linux entirely (no
# portable mechanism exists there — research.md Decision 6), so this compiles
# everywhere but is only ever invoked on macOS/Windows.
robius-authentication = "0.3.1"

# ---------------------------------------------------------------------------
# Desktop-only deps. These crates either don't compile on Android at all
# (rfd — native file dialog) or have no meaningful mobile equivalent
# (tauri-plugin-window-state — mobile windows aren't resizable/movable;
# open — opening a file in the user's "default desktop app" doesn't map to
# Android's intent system). Their call sites in `lib.rs` and `about.rs` are
# wrapped in `#[cfg(not(target_os = "android"))]`, so the Android build
# doesn't need any of these to compile.
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = "2"
rfd = "0.17"
open = "5.1"

# ---------------------------------------------------------------------------
# Linux-only deps for the end-to-end vault (spec 002).
# ---------------------------------------------------------------------------
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
# Error-type downcast only, to distinguish VAULT_NO_KEYSTORE (no secret
# service at all) from VAULT_KEYSTORE_DENIED (present but this request was
# refused/unavailable) — keyring_core::Error collapses that distinction.
# default-features = false is MANDATORY: secret-service's default crypto
# feature can pull in an OpenSSL backend, and cargo features are additive
# across the whole dependency graph, so naming one here would unify it into
# keyring's own (pure-Rust) copy. See constitution v3.1.0 table row 3 and
# research.md Decision 8.
secret-service = { version = "5", default-features = false }
# Linux idle-time query for the vault's not-disableable idle-lock timeout
# (constitution table row 6). x11rb's screensaver extension gives an exact
# millisecond idle time with no Xlib and no Accessibility-style permission
# prompt.
#
# Wayland has no equivalent API reachable without a NEW crate: the only
# Wayland-protocol library in the tree is `gdkwayland-sys` (GTK's raw FFI,
# transitively via tao), which exposes no usable Rust-level client for
# `ext-idle-notify-v1` — that would need `wayland-client` +
# `wayland-protocols`, a 7th/8th dependency and a Governance matter under
# Principle I, not a code decision. lock.rs therefore only wires up X11 idle
# detection; on a pure-Wayland session the idle timeout never fires
# (explicit lock, OS screen-lock, and sleep detection via logind/zbus below
# still work — this gap is documented, not silent, per research.md
# Decision 12's "accepted gap" characterization).
x11rb = { version = "0.14", features = ["screensaver"] }
# Linux screen-lock/sleep detection (logind over D-Bus): `Manager.
# PrepareForSleep` and `Session.Lock`/`Unlock`. zbus is already resolved in
# this tree via `secret-service` and `robius-authentication`'s (unused-here)
# Linux backend — a direct dep pins no new crate.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `StreamExt::next()` on the generated proxies' signal streams. Already
# resolved at 0.3.32 via zbus/async-io's own dependency graph.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# macOS-only deps for the end-to-end vault (spec 002): idle/screen-lock/sleep
# detection (constitution table row 6, research.md Decision 12). `objc2`,
# `block2`, and `objc2-foundation` are already resolved in this tree via
# `robius-authentication`'s Apple backend; `objc2-app-kit` (NSWorkspace) is
# already resolved via `tao`/`wry`/`muda` (Tauri's own window-management
# stack). Direct deps here pin no new crate.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
block2 = { version = "0.6.1", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSString", "NSNotification", "NSOperation", "NSDistributedNotificationCenter", "block2",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }

# ---------------------------------------------------------------------------
# Windows-only deps for the end-to-end vault (spec 002): idle/session-lock/
# power-event detection (constitution table row 6, research.md Decision 12).
# Pinned to the exact version `robius-authentication`'s Windows backend
# already resolves — a direct dep here pins no new crate version, only
# reuses the one already in the tree.
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation", "Win32_Graphics_Gdi",
] }

# ---------------------------------------------------------------------------
# Android-only deps for the end-to-end vault (spec 002 — T113, FR-038).
# ---------------------------------------------------------------------------
# `keyring`'s unconditional line above pulls in its "v1" default feature,
# which only wires up the macOS/Windows/Linux backends (each gated by its
# own target cfg inside the `keyring` crate itself, so enabling "v1"
# elsewhere is a no-op, not a leak). Android needs its backend named
# explicitly — Cargo unions the feature sets of every declaration of the
# same crate+version, so this adds android-native-keyring-store ONLY on
# Android, without disturbing what any other platform already gets.
#
# `v1` then refuses to initialize on Android (`Invalid("platform")`), after
# which `keyring::Entry::new` is a permanent `NoDefaultStore`. We therefore
# pin the already-transitive `android-native-keyring-store` and `keyring-core`
# so `keystore.rs` can `set_default_store` itself after `android_bridge.rs`
# initializes `ndk-context`. Neither is a new crate (constitution table row 2
# — OS secure-store binding); both are already in this tree via `keyring`.
# `ndk-context` is NOT initialized by Tauri — see android_bridge.rs.
[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4.2", features = ["android-native-keyring-store"] }
android-native-keyring-store = "1"
keyring-core = "1"
# JNI bridge (android_bridge.rs) that initializes `ndk-context`'s global
# Android context before the first keystore use — verified by direct source
# inspection that neither Tauri nor tao/wry do this themselves, despite
# android-native-keyring-store's README claiming otherwise. Both versions
# already resolved elsewhere in this exact tree (`jni` via `tao`,
# `ndk-context` via `android-native-keyring-store` itself) — pinning them
# directly adds no new crate.
jni = "0.21"
ndk-context = "0.1"
